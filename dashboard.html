<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Smart Table — Dashboard sala</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <div class="app app-wide">
    <div class="topbar">
      <div>
        <div class="brand">Smart Table · Responsabile</div>
        <h1 class="h1">Dashboard sala</h1>
        <p class="sub">Panoramica — i camerieri lavorano da telefono/watch</p>
      </div>
      <div>
        <a class="btn btn-soft" href="staff.html" style="display:inline-block;width:auto;text-decoration:none">Apri vista staff</a>
      </div>
    </div>

    <div class="self-check">
      <span class="dot" id="dot-cloud"></span>
      <span class="dot" id="dot-queue"></span>
      <span id="check-msg">Controllo…</span>
    </div>

    <div class="split">
      <div>
        <h2 style="color:var(--accent)">Chiamate</h2>
        <div id="lista-chiamate"></div>
      </div>
      <div>
        <h2 style="color:var(--accent)">Staff</h2>
        <div id="staff-container"></div>
        <h2 style="color:var(--accent)">Tavoli</h2>
        <div id="tables-container" class="grid-2"></div>
      </div>
    </div>
  </div>

  <script>
    const client = stClient();

    async function refreshCheck() {
      const s = await stSelfCheck(client);
      document.getElementById("dot-cloud").className = "dot " + (s.cloud ? "on" : "off");
      document.getElementById("dot-queue").className =
        "dot " + (s.queue ? "warn" : "on");
      document.getElementById("check-msg").textContent = s.message;
    }

    function ageLabel(createdAt) {
      const sec = Math.floor((Date.now() - new Date(createdAt).getTime()) / 1000);
      if (sec < 60) return sec + "s";
      return Math.floor(sec / 60) + "m " + (sec % 60) + "s";
    }

    async function caricaChiamate() {
      const { data } = await client
        .from("calls")
        .select("*")
        .in("status", ["pending", "claimed"])
        .order("created_at", { ascending: true });
      const box = document.getElementById("lista-chiamate");
      if (!data?.length) {
        box.innerHTML = '<div class="card"><strong>Sala quieta</strong></div>';
        return;
      }
      box.innerHTML = data
        .map((item) => {
          const sla = stSlaClass(item.created_at);
          const label = item.payload?.label || item.call_type;
          return `<div class="card ${sla}">
            <div class="row">
              <div>
                <strong>${item.table_number}</strong> · ${label}<br/>
                <span class="muted">${ageLabel(item.created_at)} · ${item.status}${item.claimed_by ? " · " + item.claimed_by : ""}</span>
              </div>
              <button class="btn btn-ok" style="width:auto" onclick="forceDone('${item.id}')">Chiudi</button>
            </div>
          </div>`;
        })
        .join("");
    }

    window.forceDone = async function (id) {
      await client
        .from("calls")
        .update({ status: "done", closed_at: new Date().toISOString() })
        .eq("id", id);
      caricaChiamate();
    };

    async function caricaStaff() {
      const { data } = await client.from("staff_status").select("*");
      const box = document.getElementById("staff-container");
      if (!data?.length) {
        box.innerHTML =
          '<div class="card muted">Nessuno staff in anagrafica. Aggiungi righe in staff_status su Supabase.</div>';
        return;
      }
      box.innerHTML = data
        .map((s) => {
          const paused = s.on_break;
          return `<div class="card">
            <div class="row">
              <div>
                <strong>${s.staff_name}</strong><br/>
                <span class="muted">Zone: ${s.assigned_zones || "—"}</span>
              </div>
              <span class="badge ${paused ? "break" : ""}">${
                paused ? "IN PAUSA" : s.is_on_duty ? "IN SERVIZIO" : "FUORI"
              }</span>
            </div>
          </div>`;
        })
        .join("");
    }

    async function caricaTavoli() {
      const { data } = await client
        .from("tables")
        .select("*")
        .order("table_number", { ascending: true });
      const box = document.getElementById("tables-container");
      if (!data?.length) {
        box.innerHTML =
          '<div class="card muted">Esegui SQL 001_p0_staff_first.sql per creare i tavoli.</div>';
        return;
      }
      const map = {
        free: "Libero",
        occupied: "Occupato",
        bill: "Conto",
        reset: "Da sparecchiare",
        reserved: "Riservato"
      };
      box.innerHTML = data
        .map(
          (t) => `<div class="card" style="padding:10px">
          <strong>T${t.table_number}</strong><br/>
          <span class="muted">${map[t.status] || t.status}</span>
        </div>`
        )
        .join("");
    }

    client
      .channel("dash-calls")
      .on("postgres_changes", { event: "*", schema: "public", table: "calls" }, caricaChiamate)
      .subscribe();
    client
      .channel("dash-staff")
      .on("postgres_changes", { event: "*", schema: "public", table: "staff_status" }, caricaStaff)
      .subscribe();
    client
      .channel("dash-tables")
      .on("postgres_changes", { event: "*", schema: "public", table: "tables" }, caricaTavoli)
      .subscribe();

    caricaChiamate();
    caricaStaff();
    caricaTavoli();
    refreshCheck();
    setInterval(() => {
      caricaChiamate();
      refreshCheck();
    }, 8000);
  </script>
</body>
</html>
